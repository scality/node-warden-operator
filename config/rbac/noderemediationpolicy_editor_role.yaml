# This rule is not used by the project node-warden-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the warden.scality.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: node-warden-operator
    app.kubernetes.io/managed-by: kustomize
  name: noderemediationpolicy-editor-role
rules:
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies/status
  verbs:
  - get
