# This rule is not used by the project node-warden-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to warden.scality.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: node-warden-operator
    app.kubernetes.io/managed-by: kustomize
  name: noderemediationpolicy-viewer-role
rules:
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies/status
  verbs:
  - get
