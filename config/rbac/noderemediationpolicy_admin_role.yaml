# This rule is not used by the project node-warden-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over warden.scality.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: node-warden-operator
    app.kubernetes.io/managed-by: kustomize
  name: noderemediationpolicy-admin-role
rules:
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies
  verbs:
  - '*'
- apiGroups:
  - warden.scality.com
  resources:
  - noderemediationpolicies/status
  verbs:
  - get
