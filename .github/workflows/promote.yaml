name: Promote
run-name: "Promote ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

jobs:
  # Unchanged: builds and pushes the container image before the release is
  # created, so a broken build blocks the GitHub Release.
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: false
      is-latest: true
      is-stable: ${{ ! contains(github.ref_name, '-') }}

  create-release:
    needs: build
    uses: scality/workflows/.github/workflows/promote.yaml@1c3bb83b992d0a512c08755606ee6439b26c463b # v2.13.0
    permissions:
      contents: write
