name: Promote
run-name: "Promote ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

jobs:
  # Unchanged: builds and pushes the container image before the release is
  # created, so a broken build blocks the GitHub Release.
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: false
      is-latest: true
      is-stable: ${{ ! contains(github.ref_name, '-') }}

  create-release:
    needs: build
    uses: scality/workflows/.github/workflows/promote.yaml@284fcb6c972f27f628e342199064ba8ccd5df8c2 # v2.12.0
    permissions:
      contents: write
